[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-torchao"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "torch-mlir",  
    "torchvision==0.26.0",
    "torchao==0.18.0",
    "transformers==5.5.4",
    "tokenizers==0.22.2",
    "huggingface_hub==1.33.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "datasets==5.1.0",
    "numpy==2.2.6",
    "ml_dtypes>=0.4.0",
    # model2MLIR's internal dependencies
    "xdsl==0.65.0",
    "structlog==25.5.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# The reference author's CPU functional models (third_party/pi0-quant) used as oracles and as the
# `ref_cpu` accumulation implementation: ipt_numba needs numba; ipt_c and systolic_c are compiled
# with gcc at first use.
reference = ["numba>=0.60"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["atlas_quant", "atlas_torchao", "atlas_m2m", "quant_modes", "modelutils", "datautils", "eval", "eval_policy", "ref_loader", "accum_backends", "ref_numerics", "ref_profile", "ref_attention", "accum_torch", "accum_crosscheck", "layer_rmse", "ppl_protocols", "chip_profile", "chip_ops", "chip_coverage", "op_unit_map", "pi0_model", "eval_pi0"]

# Not enabled yet: the m2m quantization adapter (atlas_m2m_adapter:atlas_fp8_adapter) is not written.
# [project.entry-points."m2m.quantization_adapters"]
# atlas_fp8 = "atlas_m2m_adapter:atlas_fp8_adapter"
